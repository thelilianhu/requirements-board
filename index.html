<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f7f9">
<title>需求管理 · 只读看板</title>
<meta name="description" content="需求管理只读看板：按阶段、项目、优先级与 OBP 查看需求与进度。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234f6bed'/%3E%3Cpath d='M9 11.5h14M9 16h9.5M9 20.5h6.5' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="dsw-req" id="app">
  <header class="dsw-req-head">
    <div class="dsw-req-heading">
      <h1 class="dsw-req-title">需求管理</h1>
      <p class="dsw-req-sub">只读展示需求管理面板的数据，可按阶段、项目、优先级与 OBP 快速筛选查看。</p>
    </div>
    <div class="dsw-req-head-actions">
      <span class="dsw-req-readonly" title="静态只读页面，不会修改本地需求面板的数据">只读看板</span>
    </div>
  </header>

  <nav class="dsw-req-tabs" data-req-tabs role="tablist" aria-label="视图">
    <button type="button" role="tab" class="dsw-req-tab" data-view="raws" aria-selected="false" aria-controls="body">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.4 12.4 6.7 5.9A2 2 0 0 1 8.6 4.6h6.8a2 2 0 0 1 1.9 1.3l2.3 6.5v4.3a2 2 0 0 1-2 2H6.4a2 2 0 0 1-2-2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M4.4 12.4h4.1l.9 1.9h5.2l.9-1.9h4.1" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      原始需求
    </button>
    <button type="button" role="tab" class="dsw-req-tab is-active" data-view="list" aria-selected="true" aria-controls="body">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8.4 6.5h11M8.4 12h11M8.4 17.5h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="4.8" cy="6.5" r="1.2" fill="currentColor"/><circle cx="4.8" cy="12" r="1.2" fill="currentColor"/><circle cx="4.8" cy="17.5" r="1.2" fill="currentColor"/></svg>
      需求管理列表
    </button>
  </nav>

  <div class="dsw-req-steps" id="steps" data-req-steps role="tablist" aria-label="阶段">
    <button type="button" role="tab" class="dsw-req-step" data-step="all" aria-selected="true">
      <span class="dsw-req-step-label">所有需求</span>
      <span class="dsw-req-step-count" data-count>–</span>
    </button>
    <button type="button" role="tab" class="dsw-req-step" data-step="analysis" aria-selected="false">
      <span class="dsw-req-step-label">方案分析</span>
      <span class="dsw-req-step-count" data-count>–</span>
    </button>
    <button type="button" role="tab" class="dsw-req-step" data-step="walkthrough" aria-selected="false">
      <span class="dsw-req-step-label">需求串讲</span>
      <span class="dsw-req-step-count" data-count>–</span>
    </button>
    <button type="button" role="tab" class="dsw-req-step" data-step="planned" aria-selected="false">
      <span class="dsw-req-step-label">已基线</span>
      <span class="dsw-req-step-count" data-count>–</span>
    </button>
    <button type="button" role="tab" class="dsw-req-step" data-step="doing" aria-selected="false">
      <span class="dsw-req-step-label">开发中</span>
      <span class="dsw-req-step-count" data-count>–</span>
    </button>
    <button type="button" role="tab" class="dsw-req-step" data-step="review" aria-selected="false">
      <span class="dsw-req-step-label">测试中</span>
      <span class="dsw-req-step-count" data-count>–</span>
    </button>
    <button type="button" role="tab" class="dsw-req-step" data-step="done" aria-selected="false">
      <span class="dsw-req-step-label">已上线</span>
      <span class="dsw-req-step-count" data-count>–</span>
    </button>
  </div>

  <main class="dsw-req-body" id="body" data-req-body>
    <noscript>
      <div class="dsw-req-empty">
        <div class="dsw-req-empty-title">需要启用 JavaScript</div>
        <div class="dsw-req-empty-hint">这个看板通过脚本读取同目录的 data.json 并渲染列表。</div>
      </div>
    </noscript>
  </main>

  <footer class="dsw-req-foot" id="foot">
    <span>正在加载数据…</span>
    <span class="dsw-req-foot-state"><span class="dsw-req-foot-dot is-loading" aria-hidden="true"></span><span class="dsw-req-foot-label">只读快照</span></span>
  </footer>
</div>
<script src="./app.js" defer></script>
<script src="chat.js"></script>
</body>
</html>
